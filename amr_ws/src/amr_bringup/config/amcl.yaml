# AMCL parameters for M6 localization (DEC-056, Task A).
# This is the amcl: section of the installed Nav2 1.3.14 file /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml,
# copied unchanged except for the lines marked "M6":
#   - laser_max_range: the simulated LiDAR's specification (DEC-031: 12 m);
#   - set_initial_pose / initial_pose: the known start (DEC-058): the robot spawns at the world origin, which is the
#     M5 reference map's origin, so AMCL starts there instead of waiting for /initialpose;
#   - alpha1-4, sigma_hit (DEC-061): motion noise from the DEC-042 odometry error model at twice its sigma, and the
#     scan likelihood width of one map cell. The installed values (0.2, 0.2 m) suit a noisy real robot; here they
#     gave random errors up to 140 mm at rest (M6 plan §12, Task A gate). AMCL's alphas are variance ratios:
#     sigma_rot = sqrt(alpha1 * rot^2 + alpha2 * trans^2), sigma_trans = sqrt(alpha3 * trans^2 + alpha4 * rot^2)
#     (nav2_amcl DifferentialMotionModel). alpha5 is used only by the omnidirectional model;
#   - map_topic (DEC-062, TS-045): AMCL reads the map origin as the centre of cell 0, ROS as its corner, so AMCL
#     gets its own copy of the map, shifted by half a cell, on /map_amcl.
# Check with:
#   diff -b <(grep -v '^ *#' amr_ws/src/amr_bringup/config/amcl.yaml | sed 's/ *# M6.*//') \
#        <(sed -n '/^amcl:/,/^bt_navigator:/p' /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml | sed '$d')
# laser_min_range -1.0 (installed) makes AMCL use the scan's own range_min, 0.12 m (DEC-031).
# Started by launch/localization.launch.py (DEC-060), which forces use_sim_time true.
amcl:
  ros__parameters:
    alpha1: 0.0016  # M6 (DEC-061): rotation noise sigma 4 % of the turn (2x the DEC-042 2 %); installed 0.2
    alpha2: 0.0004  # M6 (DEC-061): rotation noise from translation, sigma 0.02 rad/m (Assumed); installed 0.2
    alpha3: 0.0004  # M6 (DEC-061): translation noise sigma 2 % of the distance (2x the DEC-042 1 %); installed 0.2
    alpha4: 0.0004  # M6 (DEC-061): translation noise from rotation, sigma 0.02 m/rad (Assumed); installed 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0  # M6 (DEC-031): sensor maximum range; installed 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.05  # M6 (DEC-061): one map cell, about sqrt(0.01^2 + 0.035^2) (sensor noise, map quantization); installed 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map_amcl  # M6 (DEC-062, TS-045): the AMCL-convention copy of the map; installed default map
    set_initial_pose: true  # M6 (DEC-058): start from the known spawn pose; installed default false
    initial_pose:  # M6 (DEC-058): the spawn pose = the M5 reference map origin (M5 plan §12)
      x: 0.0  # M6
      y: 0.0  # M6
      z: 0.0  # M6
      yaw: 0.0  # M6
